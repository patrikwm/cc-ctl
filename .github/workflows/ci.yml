name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { node: ['22.13', '24'] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cc-ctl:ci .
      - name: smoke test
        run: |
          docker run -d --name cc -p 8080:8080 -v "$PWD/test:/claude:ro" cc-ctl:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/api/state >/dev/null && break; sleep 1; done
          curl -fs localhost:8080/api/help | grep -q query_params
          curl -fs "localhost:8080/api/query?group=model" | grep -q group_by
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag cc-ctl:ci ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:latest
